[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
quick-xml = "0.38"
flate2 = "1"
log = "0.4"
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev]
opt-level = 1
