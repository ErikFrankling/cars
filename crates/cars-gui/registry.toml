# What cars-gui offers. Read from this file at start, so adding a scenario or lighting up a model
# needs no rebuild. See README.md, "Adding a scenario".
#
# trust is required on every scenario and is what the picker shows, from research/truth/VALIDATION-GATE.md:
#   matches_real_day  passed every check of the gate against a real measured day
#   partly_checked    passed some of them; say which in trust_note
#   not_checked       a real place, never compared with a real measured day
#   speed_benchmark   cannot pass: no real day to compare with. Only good for measuring speed
# Having been used before earns nothing. Move an entry up only with the gate's evidence.
#
# Paths starting with $DATA are under the cars data directory, $THESIS under the thesis config,
# $REPO under this repository and $CACHE under the generated files. `generate` builds missing files:
# it runs from $REPO and gets the scenario's cache directory as its last argument.

# Generated roads. There is no real day to compare these with.

[[scenario]]
id = "phantom-jam"
name = "Phantom jam ring"
group = "Test roads"
description = "22 drivers on a 330 m ring. A 3 m nudge grows into stop-and-go waves with no obstacle."
trust = "speed_benchmark"
trust_note = "A made-up ring: there is no real day to compare it with."
generate = "python3 scripts/gui_scenarios.py phantom_jam"
net = "$CACHE/net.xml"
routes = ["$CACHE/routes.xml"]
dt = 0.1
end = 1800.0

