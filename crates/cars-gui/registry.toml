# Automated car models. status = "merged" can be chosen; anything else is listed greyed out with
# `branch` as the reason. Lighting one up once it merges: set status = "merged" and give it a vtype.
# A vtype is one <vType> from the demand format, with id="gui_av". `coordinated = true` runs the
# signal-free coordinator and needs every car automated, because this build has no mixed mode.

[[model]]
id = "krauss"
name = "Krauss"
description = "Thesis tier: Krauss car following with no driver noise and a short headway."
status = "merged"
vtype = '<vType id="gui_av" vClass="passenger" length="5" carFollowModel="Krauss" accel="3.5" decel="2.2" emergencyDecel="4.5" sigma="0.0" tau="0.6" minGap="1.5" speedFactor="1.0" speedDev="0.0"/>'

[[model]]
id = "idm"
name = "IDM"
description = "Thesis tier: the intelligent driver model with a short headway."
status = "merged"
vtype = '<vType id="gui_av" vClass="passenger" length="5" carFollowModel="IDM" accel="3.5" decel="2.2" emergencyDecel="4.5" tau="0.6" minGap="1.5" speedFactor="1.0" speedDev="0.0"/>'

[[model]]
id = "acc"
name = "ACC"
description = "Thesis tier: adaptive cruise control."
status = "merged"
vtype = '<vType id="gui_av" vClass="passenger" length="5" carFollowModel="ACC" accel="1.0" maxSpeed="33.33" tau="1.5" minGap="2.0" speedDev="0.0"/>'

[[model]]
id = "cacc"
name = "CACC"
description = "Thesis tier: cooperative adaptive cruise control."
status = "merged"
vtype = '<vType id="gui_av" vClass="passenger" length="5" carFollowModel="CACC" accel="1.0" maxSpeed="33.33" tau="0.6" minGap="1.0" speedDev="0.0"><param key="headwayTimeACC" value="1.5"/></vType>'

[[model]]
id = "glosa"
name = "GLOSA"
description = "Thesis tier: IDM with green light speed advice within 300 m of a signal."
status = "merged"
vtype = '<vType id="gui_av" vClass="passenger" length="5" carFollowModel="IDM" accel="2.6" decel="2.0" emergencyDecel="4.5" tau="1.0" minGap="2.5" speedFactor="1.0" speedDev="0.1"><param key="has.glosa.device" value="true"/><param key="device.glosa.range" value="300"/></vType>'

[[model]]
id = "d8"
name = "D8 coordinated junctions"
description = "Signal-free junctions: a coordinator gives every car a slot through the box. All cars automated, no lane changes unless the demand allows them."
status = "merged"
coordinated = true
vtype = '<vType id="gui_av" carFollowModel="CarsAV" length="5" width="1.8" minGap="2.0" accel="2.6" decel="2.5" emergencyDecel="7" apparentDecel="4.5" tau="0.8" sigma="0" maxSpeed="50" speedDev="0" lcStrategic="1" lcSpeedGain="0" lcKeepRight="0" lcCooperative="0"><param key="reactionTime" value="0.3"/></vType>'

[[model]]
id = "d1-d7"
name = "D1 to D7 tiers"
description = "The communicating tiers."
status = "not_merged"
branch = "t3/882bd39f"

[[model]]
id = "m1"
name = "M1 neural driver"
description = "A trained neural network as the driver."
status = "not_merged"
branch = "t3/aea36e36"

[[model]]
id = "physical"
name = "Physical driver"
description = "Vehicle physics: power, grip and energy."
status = "not_merged"
branch = "t3/1c6fee50"

[[model]]
id = "human"
name = "Fitted human driver"
description = "Human driving fitted to real measurements."
status = "not_merged"
branch = "t3/1b36c9cf"
