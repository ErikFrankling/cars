[package]
name = "cars-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cars-gui"
path = "src/main.rs"

[dependencies]
cars-core = { path = "../cars-core" }
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rustc-hash.workspace = true
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["wayland", "x11", "clipboard"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
toml = "0.9"
